[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-injections-skill"
version = "0.1.0"
description = "Sanitize untrusted HTML, PDF, and Office files before an agent reads them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pymupdf>=1.24.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sanitize = "sanitize_skill.cli:main"
sanitize-check = "sanitize_skill.quotes:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
