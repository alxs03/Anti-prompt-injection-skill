[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-injections-skill"
version = "0.1.0"
description = "Sanitize untrusted HTML, PDF, and Office files before an agent reads them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pymupdf>=1.24.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
sanitize = "sanitize_skill.cli:main"
sanitize-check = "sanitize_skill.quotes:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/sanitize_skill"]
omit = [
    "src/sanitize_skill/bench.py",
    "src/sanitize_skill/corpus.py",
    "src/sanitize_skill/__main__.py",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["sanitize_skill"]
ignore_missing_imports = true
warn_unused_ignores = false

